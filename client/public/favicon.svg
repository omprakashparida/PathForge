<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PathForge logo">
  <defs>
    <linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B1E11"/>
      <stop offset="100%" stop-color="#120D08"/>
    </linearGradient>
    <linearGradient id="pf-ember" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC46B"/>
      <stop offset="55%" stop-color="#FF8A1E"/>
      <stop offset="100%" stop-color="#F96A0A"/>
    </linearGradient>
    <radialGradient id="pf-glow" cx="50%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#FF8A1E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF8A1E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded-square app tile -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#pf-bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#pf-glow)"/>
  <rect x="10" y="10" width="492" height="492" rx="114" fill="none"
        stroke="#FF8A1E" stroke-opacity="0.3" stroke-width="4"/>

  <!-- PF monogram -->
  <text x="256" y="342" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="228" font-weight="bold" letter-spacing="6"
        fill="url(#pf-ember)">PF</text>

  <!-- forge spark accent -->
  <circle cx="388" cy="148" r="20" fill="#FF8A1E" opacity="0.22"/>
  <circle cx="388" cy="148" r="9" fill="#FFC46B"/>
</svg>
